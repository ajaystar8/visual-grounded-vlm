# OpenO3VideoDatasetConfig
min_pixels: 100_352
max_pixels: 401_408
max_frames: 32
sft_system_prompt_path: /projects/torresani-lab/ajay/visual-grounded-vlm/prompts/train/openo3_red_bbox_dense.md

# ModelConfig
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj"]

# SFTConfig
run_name: openo3_video_dense_red_bbox_32
