per_device_train_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 2
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_steps: 44
bf16: true
report_to: wandb
save_strategy: "epoch"
logging_strategy: "steps"
logging_steps: 0.1
gradient_checkpointing: False
max_grad_norm: 5
