# MyScriptArguments
wandb_project_name: visual-grounded-vlm

# OpenO3DatasetConfig
annotation_json_path: "/projects/torresani-lab/ajay/datasets/Open-o3-Video/json_data/STGR-SFT.json"
dataset_root: "/projects/torresani-lab/ajay/datasets/Open-o3-Video/"
system_prompt_path: "/projects/torresani-lab/ajay/visual-grounded-vlm/prompts/train/openo3_red_bbox_stqa.md"
annotate_frames: true
replace_boxes: true
replacement_text: "as highlighted by the red bounding box"
bbox_thickness: 2

# ModelConfig
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj"]

# SFTConfig
run_name: only_kf_red_bbox
output_dir: /scratch/rajendrakumar.a/visual-grounded-vlm/sft/checkpoints/sft_qwen25vl7bi
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 1
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_steps: 44 # 0.05% of 7047 
bf16: true
logging_steps: 10
report_to: wandb
save_strategy: "epoch"
logging_strategy: "steps"
logging_steps: 0.1
gradient_checkpointing: False
max_grad_norm: 5

